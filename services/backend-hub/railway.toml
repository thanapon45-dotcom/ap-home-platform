# Railway config for Hub v2
# v1 (server.cjs) ยังใช้งานได้ผ่าน start command override ใน Railway dashboard
# Shadow service ใหม่ใช้ไฟล์นี้ → build TypeScript → run dist/server.js

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# v1: ตั้ง HUB_MODE=v1 ใน Railway Variables → รัน server.cjs (ไม่ต้อง build)
# v2: ไม่ต้องตั้ง HUB_MODE (default) → รัน dist/server.js
startCommand = "sh -c 'if [ \"$HUB_MODE\" = \"v1\" ]; then node server.cjs; else node dist/server.js; fi'"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
