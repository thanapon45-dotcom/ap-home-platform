# Railway config for Hub v2
# v1 (server.cjs) ยังใช้งานได้ผ่าน start command override ใน Railway dashboard
# Shadow service ใหม่ใช้ไฟล์นี้ → build TypeScript → run dist/server.js

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node dist/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
